name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres          # default DB; test DB created below
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create test database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE test_tracker;"

      - name: Run Alembic migrations against test database
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/test_tracker
          SECRET_KEY: test-secret-key-that-is-at-least-32-chars-long
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: "30"
        run: alembic upgrade head

      - name: Run tests
        env:
          # Points the test suite at the dedicated test database
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/test_tracker
          # Also needed so app/config.py can initialise (it validates on import)
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/test_tracker
          SECRET_KEY: test-secret-key-that-is-at-least-32-chars-long
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: "30"
          ALLOWED_ORIGINS: "http://localhost:5173"
          UPLOAD_DIR: uploads/resumes
        run: python -m pytest tests/ -v
