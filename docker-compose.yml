services:

  api:
    build: .
    image: jobtracker-api

    ports:
      - "8000:8000"

    env_file:
      - .env

    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ./uploads:/app/uploads

  db:
    image: postgres:17

    container_name: postgres-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: job_application_tracker

    ports:
      - "5432:5432"

    restart: unless-stopped

    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d job_application_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: